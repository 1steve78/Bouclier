name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Code Formatting
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "Unformatted Go files detected:"
            echo "$DIFF"
            exit 1
          fi

      - name: Verify go.mod & go.sum Cleanliness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Unit & Integration Tests (with Race Detector)
        run: go test -v -race -count=1 ./...

      - name: Fuzz Smoke Tests
        run: |
          go test -run=^$ -fuzz=FuzzNormalizeIndicator -fuzztime=2s ./internal/intel
          go test -run=^$ -fuzz=FuzzParseIndicatorsJSON -fuzztime=2s ./internal/intel
          go test -run=^$ -fuzz=FuzzCertificateSANProcessing -fuzztime=2s ./internal/certanalysis
          go test -run=^$ -fuzz=FuzzDomainNormalization -fuzztime=2s ./internal/heuristics
          go test -run=^$ -fuzz=FuzzRenderReport -fuzztime=2s ./internal/report

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o bin/bouclier-linux .
          CGO_ENABLED=0 GOOS=windows go build -trimpath -ldflags="-s -w" -o bin/bouclier.exe .

      - name: Security Vulnerability Scan (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
